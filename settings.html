<div id="rolib-root" class="rolib-root">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <b>角色换肤库</b>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
      <div id="rolib-library-panel">
      <div class="rolib-toolbar">
        <span>当前槽位</span>
        <button class="menu_button rolib-slot active" data-slot="A">甲</button>
        <button class="menu_button rolib-slot" data-slot="B">乙</button>
        <button class="menu_button" id="rolib-refresh-input">更新输入框</button>
      </div>
      <div id="rolib-status" class="rolib-status"></div>
      <div class="rolib-tabs">
        <button class="menu_button active" data-tab="characters">角色</button>
        <button class="menu_button" data-tab="outfits">服装</button>
      </div>
      <section id="rolib-tab-characters" class="rolib-tab-content active">
        <div class="rolib-search-row">
          <select id="rolib-work-select" class="text_pole rolib-mobile-select" aria-label="选择作品"></select>
          <input id="rolib-character-search" class="text_pole" type="search" placeholder="搜索作品、角色或英文 tag">
          <button id="rolib-random-character" class="menu_button">作品内随机</button>
        </div>
        <div id="rolib-work-list" class="rolib-chip-list"></div>
        <div id="rolib-character-list" class="rolib-grid"></div>
      </section>
      <section id="rolib-tab-outfits" class="rolib-tab-content">
        <div class="rolib-search-row">
          <select id="rolib-outfit-group-select" class="text_pole rolib-mobile-select" aria-label="选择服装分类"></select>
          <input id="rolib-outfit-search" class="text_pole" type="search" placeholder="搜索服装或英文 tag">
          <button id="rolib-random-outfit" class="menu_button">分类内随机</button>
        </div>
        <div id="rolib-outfit-groups" class="rolib-chip-list"></div>
        <div id="rolib-outfit-list" class="rolib-grid"></div>
      </section>
      <div class="rolib-footer">
        <button id="rolib-clear-current" class="menu_button">清当前槽</button>
        <button id="rolib-clear-all" class="menu_button">全部清空</button>
      </div>
      <small class="rolib-note">选择后只更新变量和输入框，不会自动发送。角色与服装仅改变 image### 外观；正文姓名、身份、性格和关系保持不变。</small>
      </div>
    </div>
  </div>
</div>
